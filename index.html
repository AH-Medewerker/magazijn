<meta name="apple-mobile-web-app-title" content="Magazijn">
<style>
:root{--blue:#00a0e2;--blue2:#e6f6fd;--bg:#f3f6f9;--tx:#0f2a3d;--mut:#6b7f8f;--line:#e1e8ee;--hi:#e8472b;--hibg:#fdecea;--ok:#12a150;color-scheme:light;
box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:20px;margin:0;font-weight:800;color:var(--blue)}
.cnt{font-size:13px;color:var(--mut)}
.bar{height:8px;background:var(--blue2);border-radius:6px;overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:999px}
.tabs button{flex:1;font:inherit;font-weight:700;font-size:15px;border:0;background:none;color:var(--mut);padding:10px 8px;border-radius:999px}
.tabs button.on{background:var(--blue);color:#fff}
.tabs small{font-weight:600;opacity:.85;margin-left:4px}
main{max-width:560px;margin:0 auto;padding:0 14px}
.vracht{background:#fff;border-radius:16px;padding:12px;margin:14px 0 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 1px 3px rgba(15,42,61,.08)}
.vracht b{flex:1 1 100%}
.vracht input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx)}
.vracht button{font:inherit;padding:10px 14px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:700}
.vracht button.alt{background:var(--line);color:var(--tx)}
.vstat{flex:1 1 100%;font-size:15px;color:var(--mut)}
.grp{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:18px 2px 8px;color:var(--tx)}
.grp .pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--blue2);color:var(--blue)}
.grp.hi .pill{background:var(--hibg);color:var(--hi)}
.note{background:#fff7e6;border-left:4px solid #ff9f1a;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px}
.t{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--tx);border:0;border-radius:16px;padding:14px;margin-bottom:8px;min-height:60px;background:#fff;box-shadow:0 1px 3px rgba(15,42,61,.08);border-left:6px solid var(--blue)}
.t.hi{border-left-color:var(--hi)}
.t.lo{border-left-color:var(--line)}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff}
.t.hi .box{border-color:var(--hi)}
.t.lo .box{border-color:#b5c3cf}
.t.done{opacity:.5}
.t.done .box{background:var(--ok);border-color:var(--ok)}
.t.done .tx{text-decoration:line-through}
.tx{font-weight:600}
.sub{display:block;font-size:14px;color:var(--mut);margin-top:2px;font-weight:400}
.num{color:var(--mut);margin-right:2px}
.foot{text-align:center;margin-top:24px}
.foot button{font:inherit;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px}

.ov{position:fixed;inset:0;background:rgba(15,42,61,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.show{display:flex}
.dlg{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg .ic{font-size:44px}
.dlg h3{margin:6px 0 4px;font-size:21px;color:var(--blue)}
.dlg p{margin:0 0 16px;color:var(--mut);font-size:16px}
.dlg .row{display:flex;gap:10px}
.dlg button{flex:1;font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;padding:14px}
.dlg .ja{background:var(--blue);color:#fff}
.dlg .nee{background:var(--line);color:var(--tx)}
.toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;background:var(--hi);color:#fff;font-weight:700;padding:14px 16px;border-radius:14px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:536px;margin:0 auto}
.toast.show{display:block}
.vracht button.bell{background:var(--blue2);color:var(--blue)}
.lbl{display:inline-block;font-size:12px;font-weight:700;background:var(--blue2);color:var(--blue);border-radius:999px;padding:2px 8px;margin-top:4px}
</style>
</head>
<body>
<header>
<div class="top"><h1>Magazijn avonddienst</h1><span class="cnt" id="cnt"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="tabs" id="tabs"></div>
</header>
<main>
<div class="vracht" id="vr">
<b>🚚 Vracht</b>
<input type="time" id="vt" aria-label="Verwachte aankomst">
<button id="vh">Vracht is er</button>
<button class="bell" id="bell">🔔 Meldingen aan</button>
<div class="vstat" id="vs"></div>
<div class="vstat" id="ns"></div>
</div>
<div id="list"></div>
<div class="foot"><button id="reset">Alles resetten</button></div>
</main>
<div class="ov" id="ov"><div class="dlg"><div class="ic">🏷️</div><h3>Retourlabel erop?</h3><p id="ovt">Zit het retourlabel op de kant waar de wielen draaien?</p><div class="row"><button class="nee" id="nee">Nee</button><button class="ja" id="ja">Ja</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
// prio: 0 = hoog, 1 = normaal, 2 = laag
var P=[
{n:"Voor de vracht",g:[
{n:"Hoge prioriteit",pill:"Moet",hi:1,t:[
["v1","Karren op de vloer","Even afstemmen met shiftleider",0],
["v2","Fusten uit de koeling naar magazijn achter","",0,1],
["v3","Fusten afknopen en naar magazijn achter rijden","Als ze op hoogte zijn",0,1]]},
{n:"Als je tijd over hebt",pill:"Kan",t:[
["k1","Kartonbaal checken","Zit hij vol? Dan ook naar magazijn achter",1,1],
["k2","Plastic kijken","Ook als hij bijna vol is",1,1],
["k3","Flessenbandzak naar magazijn achter brengen","",1,1]]}]},
{n:"Na de vracht",g:[
{n:"Eerst",pill:"Hoge prioriteit",hi:1,note:"Terminal werkt niet (storing). Splitsen kan misschien nog niet.",t:[
["a1","Vers restant splitsen","Vers-karren van de vrachtwagen, per gangpad. Kan niet voor de vracht",0]]},
{n:"Daarna",pill:"Geen vaste volgorde",t:[
["a2","Emballage flessen leeghalen","Plastic, karton en flessenbandzak ook, als ze vol zijn",1],
["r1","Houdbaar splitsen","Kratten uit de winkel scannen: de dag staat erop. Sorteren per dag + lang",1],
["r2","Schrobmachine geleegd, open en aan de lader","",1],
["r3","Gootsteen leeg","",1],
["r4","Emballage opgeruimd","",1],
["r5","Nieuwe zak plastic","",1],
["r6","Prullenbak emballage vervangen","",1],
["r7","Dagrestanten voor morgen apart zetten","",1],
["r8","Afboekingen gedaan + 4 nieuwe fusten klaar op rolly","",1]]},
{n:"Als laatste",pill:"Laatste taak",t:[
["r9","Deur op slot en vegen","",2]]}]}
];
var K="magazijn-v3",S={done:{},time:"",here:false,tab:0};
try{var r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var total=0;P.forEach(function(p){p.g.forEach(function(g){total+=g.t.length})});
function render(){
var d=0,tabs="",h="";
P.forEach(function(p,i){
var pd=0,pt=0;
p.g.forEach(function(g){g.t.forEach(function(t){pt++;if(S.done[t[0]])pd++})});
d+=pd;
tabs+='<button data-tab="'+i+'" class="'+(S.tab===i?'on':'')+'">'+p.n+'<small>'+pd+'/'+pt+'</small></button>';
});
var p=P[S.tab];
p.g.forEach(function(g){
h+='<div class="grp'+(g.hi?' hi':'')+'">'+g.n+'<span class="pill">'+g.pill+'</span></div>';
if(g.note)h+='<div class="note">'+g.note+'</div>';
g.t.forEach(function(t){
var on=S.done[t[0]],cl=t[3]===0?' hi':(t[3]===2?' lo':'');
h+='<button class="t'+cl+(on?' done':'')+'" data-id="'+t[0]+'"><span class="box">'+(on?'✓':'')+'</span><span class="tx">'+t[1]+(t[2]?'<span class="sub">'+t[2]+'</span>':'')+(t[4]?'<span class="lbl">🏷️ Retourlabel</span>':'')+'</span></button>';
});
});
document.getElementById('tabs').innerHTML=tabs;
document.getElementById('list').innerHTML=h;
document.getElementById('pb').style.width=(d/total*100)+'%';
document.getElementById('cnt').textContent=d+' van '+total+' klaar';
}
document.getElementById('tabs').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
S.tab=+b.getAttribute('data-tab');save();render();window.scrollTo(0,0);
});
document.getElementById('list').addEventListener('click',function(e){
var b=e.target.closest('.t');if(!b)return;
var id=b.getAttribute('data-id');
if(S.done[id]){delete S.done[id];save();render();return}
var lab=false;P.forEach(function(p){p.g.forEach(function(g){g.t.forEach(function(t){if(t[0]===id&&t[4])lab=true})})});
if(lab){pend=id;document.getElementById('ov').classList.add('show')}
else{S.done[id]=1;save();render()}
});
var pend=null;
function closeOv(){document.getElementById('ov').classList.remove('show');pend=null}
document.getElementById('ja').addEventListener('click',function(){if(pend){S.done[pend]=1;save();render()}closeOv()});
document.getElementById('nee').addEventListener('click',function(){closeOv();toast('Eerst het retourlabel erop, aan de kant waar de wielen draaien.')});
var tt;
function toast(m,keep){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);if(!keep)tt=setTimeout(function(){e.classList.remove('show')},4000)}
document.getElementById('toast').addEventListener('click',function(){this.classList.remove('show')});
function notify(m){
try{if('Notification' in window&&Notification.permission==='granted')new Notification('Vracht',{body:m})}catch(e){}
try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
toast('🚚 '+m,true);
}
function perm(){
var n=document.getElementById('ns'),b=document.getElementById('bell');
if(!('Notification' in window)){n.textContent='Meldingen kan deze browser niet. Je krijgt alleen een melding in de app.';b.style.display='none';return}
if(Notification.permission==='granted'){n.textContent='Meldingen aan: 15 min, 5 min en op het moment van de vracht (alleen als de app open staat).';b.style.display='none'}
else if(Notification.permission==='denied'){n.textContent='Meldingen staan uit in je browser. Je krijgt alleen een melding in de app.';b.style.display='none'}
else n.textContent='';
}
document.getElementById('bell').addEventListener('click',function(){
try{Notification.requestPermission().then(perm)}catch(e){perm()}
});
function check(m){
if(S.here||!S.time)return;
S.sent=S.sent||{};
[[15,'Nog 15 minuten tot de vracht. Rond de moet-taken af.'],[5,'Vracht komt over 5 minuten.'],[0,'De vracht is er (bijna). Begin met vers splitsen.']].forEach(function(x){
var k=S.time+':'+x[0];
if(m<=x[0]&&m>=x[0]-5&&!S.sent[k]){S.sent[k]=1;save();notify(x[1])}
});
}
function vr(){
var el=document.getElementById('vr'),s=document.getElementById('vs'),b=document.getElementById('vh');
document.getElementById('vt').value=S.time||"";
b.textContent=S.here?'Toch nog niet':'Vracht is er';
b.className=S.here?'alt':'';
if(S.here){s.textContent='Vracht is binnen: begin met vers splitsen.';return}
if(!S.time){s.textContent='Tijd onbekend (storing). Vul in zodra je het weet.';return}
var p=S.time.split(':'),n=new Date(),t=new Date();
t.setHours(+p[0],+p[1],0,0);
var m=Math.round((t-n)/60000);
check(m);
s.textContent=m>=0?'Nog '+m+' min tot de vracht ('+S.time+')':'Vracht had er om '+S.time+' moeten zijn ('+(-m)+' min geleden)';
}
document.getElementById('vt').addEventListener('change',function(e){S.time=e.target.value;save();vr()});
document.getElementById('vh').addEventListener('click',function(){
S.here=!S.here;if(S.here)S.tab=1;save();render();vr();
});
document.getElementById('reset').addEventListener('click',function(){
if(confirm('Alles resetten?')){S={done:{},time:"",here:false,tab:0};save();render();vr()}
});
render();vr();perm();setInterval(vr,30000);
</script>
</body>
</html>
